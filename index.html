<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>CodeLab | Online Code Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: "#09090b", panel: "#111114", line: "#29292f", lime: "#d4f36a" },
          fontFamily: { sans: ["Inter", "system-ui", "sans-serif"], mono: ["DM Mono", "monospace"] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; }
    button, select, textarea { font: inherit; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #d4f36a; outline-offset: 2px; }
    .CodeMirror { height: 100%; width: 100%; background: #0c0c0f; font: 12.5px/1.8 "DM Mono", monospace; }
    .CodeMirror-gutters { background: #0c0c0f; border-right: 1px solid #29292f; }
    .CodeMirror-linenumber { color: #666674; }
    .CodeMirror-cursor { border-left: 2px solid #d4f36a; }
    .editor-frame { height: min(64vh, 620px); min-height: 360px; overflow: hidden; }
    .terminal-output { height: clamp(210px, 32vh, 360px); min-height: 190px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    #output[data-tone="success"] { color: #d4f36a; }
    #output[data-tone="error"] { color: #fda4af; }
    #status[data-tone="success"] { color: #d4f36a; }
    #status[data-tone="error"] { color: #fda4af; }
    #status[data-tone="active"] { color: #facc15; }
    #toast { transition: opacity .15s ease; }
    @media (max-width: 767px) {
      .editor-frame { height: 440px; min-height: 320px; }
      .terminal-output { height: 230px; }
    }
  </style>
</head>
<body class="bg-ink text-zinc-100 font-sans text-sm antialiased">
  <header class="border-b border-line bg-[#0c0c0f]">
    <div class="mx-auto flex h-16 max-w-[1500px] items-center gap-3 px-4 sm:px-6">
      <div class="grid h-9 w-9 place-items-center rounded-lg bg-lime font-mono font-medium text-zinc-950">&lt;/&gt;</div>
      <div class="font-extrabold tracking-tight">CodeLab</div>
    </div>
  </header>

  <main class="mx-auto max-w-[1500px] px-3 py-4 sm:px-6 sm:py-5">
    <section class="grid grid-cols-1 items-stretch gap-3 lg:grid-cols-[minmax(0,1.25fr)_minmax(320px,.8fr)]">
      <section class="min-w-0 overflow-hidden rounded-xl border border-line bg-panel">
        <div class="flex min-h-14 flex-wrap items-center justify-between gap-2 border-b border-line bg-[#141417] px-3 py-2">
          <div class="flex items-center gap-2">
            <span id="fileTag" class="rounded-md bg-zinc-800 px-2 py-1 font-mono text-[10px] text-lime">C++</span>
            <span id="fileName" class="text-xs font-semibold text-zinc-200">main.cpp</span>
          </div>
          <div class="flex items-center gap-2">
            <label class="cursor-pointer rounded-md border border-zinc-700 bg-zinc-800 px-3 py-2 text-xs hover:border-zinc-500">
              Import
              <input id="importFile" type="file" accept=".c,.h,.cpp,.cc,.cxx,.hpp,.py,.java,.txt" class="sr-only" aria-label="Import source file">
            </label>
            <button id="export" type="button" class="rounded-md border border-zinc-700 bg-zinc-800 px-3 py-2 text-xs hover:border-zinc-500">Export</button>
            <label for="language" class="sr-only">Programming language</label>
            <select id="language" class="rounded-md border border-zinc-700 bg-zinc-800 px-2 py-2 text-xs text-zinc-100">
              <option value="cpp" selected>C++</option>
              <option value="c">C</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
            </select>
            <button id="reset" type="button" class="rounded-md border border-zinc-700 bg-zinc-800 px-3 py-2 text-xs hover:border-zinc-500">Reset</button>
            <button id="run" type="button" class="rounded-md border border-lime bg-lime px-3 py-2 text-xs font-extrabold text-zinc-950 hover:bg-[#e1ff87]">▶ Run</button>
          </div>
        </div>

        <div class="editor-frame">
          <textarea id="code" aria-label="Source code">#include <iostream>
#include <string>
using namespace std;

int main() {
    string name;
    cout << "Enter your name: ";
    cin >> name;
    cout << "Hello, " << name << "!" << endl;
    return 0;
}</textarea>
        </div>
        <div class="flex items-center justify-between gap-3 border-t border-line px-3 py-2 text-[10px] text-zinc-500">
          <span id="lineCount">11 lines</span>
          <span id="cursorPosition">Ln 1, Col 1</span>
          <span>Draft saved locally <span class="text-lime">●</span></span>
        </div>
      </section>

      <section class="flex min-w-0 flex-col overflow-hidden rounded-xl border border-line bg-panel">
        <div class="flex h-12 items-center gap-2 border-b border-line bg-[#141417] px-3">
          <span class="rounded-md bg-zinc-800 px-3 py-2 text-[11px] font-semibold">Terminal</span>
          <span id="status" data-tone="muted" class="ml-auto font-mono text-[10px] text-zinc-400">IDLE</span>
        </div>
        <pre id="output" data-tone="normal" class="terminal-output m-0 flex-1 bg-[#0c0c0f] p-4 font-mono text-xs leading-6 text-zinc-300">CodeLab terminal
Run your program to see output here.

› Ready for execution.</pre>
        <div class="flex items-center justify-between gap-3 border-y border-line bg-[#141417] px-3 py-3">
          <label for="stdin" class="text-xs font-semibold">Program input <span class="ml-1 rounded bg-zinc-800 px-1.5 py-1 font-mono text-[10px] text-lime">stdin</span></label>
          <span class="text-[10px] text-zinc-500">Input before Run</span>
        </div>
        <textarea id="stdin" aria-label="Program input" spellcheck="false" placeholder="Type input for your program, one value per line..." class="min-h-28 w-full resize-y border-0 bg-[#101014] px-3 py-3 font-mono text-xs leading-6 text-zinc-200 outline-none placeholder:text-zinc-600">Deepak</textarea>
        <div class="flex items-center justify-between gap-3 border-t border-line bg-[#141417] px-3 py-3">
          <span class="max-w-[58%] text-[10px] leading-4 text-zinc-500">Multiple lines supported.<br>Not a live interactive TTY.</span>
          <div class="flex gap-2">
            <button id="clearInput" type="button" class="rounded-md border border-zinc-700 bg-zinc-800 px-2.5 py-2 text-[10px] hover:border-zinc-500">Clear input</button>
            <button id="clearOutput" type="button" class="rounded-md border border-zinc-700 bg-zinc-800 px-2.5 py-2 text-[10px] hover:border-zinc-500">Clear output</button>
          </div>
        </div>
      </section>
    </section>

  </main>
  <div id="toast" role="status" class="hidden fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-3 text-xs text-zinc-100 shadow-xl"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
